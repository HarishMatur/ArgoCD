apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend-app
  namespace: argocd

  labels:
    app: frontend
    environment: dev

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: app-of-apps

  source:
    repoURL: https://github.com/HarishMatur/ArgoCD.git
    targetRevision: main
    path: app-of-apps/manifest/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: app-of-apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10