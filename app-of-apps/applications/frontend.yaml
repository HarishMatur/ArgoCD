apiVersion: agroproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-app
  namespace: argocd
  labels:
    app: frontend
    environment: dev

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: app-of-apps
  source:
      repoURL: https://github.com/HarishMatur/ArgoCD.git
      targetRevision: main
      path: app-of-apps/manifest/frontend
  destinations:
      server: https://kubernetes.default.svc
      namespace: app-of-apps
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    
    syncOptions:
      - CreateNamespace: true
      - ApplyOutofSyncOnly: true
      - PruneLast: true
      - ServerSideApply: true

    retry:
      limit: 5
      backoff:
        factor: 2
        MaxDuration: 3m
        duration: 5s
  
  revisionHistoryLimit: 10

