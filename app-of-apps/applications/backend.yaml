apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-app
  namespace: argocd
  labels:
    app: backend
    environment: dev

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: app-of-apps
  source:
    repoURL: https://github.com/HarishMatur/ArgoCD.git
    targetRevision: main
    path: app-of-apps/manifest/backend
  destinations:
    server: https://kubernetes.default.svc
    namespace: app-of-apps
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    
    syncOptions:
      - CreateNamespace: true
      - PruneLast: true
      - ApplyOutOfSyncOnly: true
      - ServerSideApply: true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10
