apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: root-application
    namespace: argocd
    labels:
      app: root
      environment: dev

    finalizers:
      - resources-finalizer.argocd.argoproj.io

spec:
    project: app-of-apps
    source:
      repoURL: https://github.com/HarishMatur/ArgoCD.git
      targetRevision: main
      path: app-of-apps/applications
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd

    syncPolicy:

      automated:
        prune: true
        selfHeal: true
        allowEmpty: false

      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - PruneLast=true
        
      retry:
        limit: 5
        backoff:
          duration: 5s
          factor: 2
          maxDuration: 3m

    revisionHistoryLimit: 10

