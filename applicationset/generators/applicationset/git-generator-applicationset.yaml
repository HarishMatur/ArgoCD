apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: git-generator-applicationset
  namespace: argocd

spec:
  goTemplate: true

  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/HarishMatur/ArgoCD.git
        revision: main

        directories: 
          - path: applicationset/generators/manifest/*
  
  template:


    metadata:
      name: '{{.path.basename}}-git-app'

      labels:
        app: '{{.path.basename}}'
        managed-by: git-applicationset
        environment: dev

    spec:
      project: applicationset

      source:
        repoURL: https://github.com/HarishMatur/ArgoCD.git
        targetRevision: main
        path: '{{.path}}'
      
      destination:
        server: https://kubernetes.default.svc
        namespace: git-generator

      syncPolicy:
        automated:
          prune: true
          selfHeal: true

        
        syncOptions:
          - CreateNamespace=true
          - AllowOutOfSyncOnly=true
          - PruneLast=true
          - ServerSideApply=true
        
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      revisionHistoryLimit: 10

