apiVersion: argoproj.io/v1alpha1
kind: application

metadata:
  name: gitops-bootstrap
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-1"

spec:
  project: default

  source:
    repoURL: https://github.com/HarishMatur/ArgoCD.git
    targetRevision: main
    path: production-gitops/platform
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true