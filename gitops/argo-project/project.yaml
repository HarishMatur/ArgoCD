apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: This is a sample Argo project for frontend and backend applications
  sourceRepos:
    - https://github.com/HarishMatur/ArgoCD.git
  destinations:
    - namespace: apps
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  clusterResourceWhitelist:
    - group: '*' 
      kind: '*'
